name: Multi steps workflow
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  multi-stage-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2 #(Clones the current repo/branch into the runner container(workspace))
      - name: Sample Step 2
        run: |
          sleep 10
          cat /etc/os-release
          echo "Sleeping for 10 seconds"
      - name: Sample Step 3
        run: echo "Hello World"
      
